
# ICS-LogQueryGPT Docker Compose Configuration
# Author: Haneen
# Architecture: App in Docker, Ollama on Host

version: '3.8'

services:
  ics-loggpt:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: ics-loggpt-app
    ports:
      - "8501:8501"
    environment:
      # Connect to Ollama on host machine
      - OLLAMA_HOST=host.docker.internal:11434
      - PYTHONUNBUFFERED=1
      - STREAMLIT_SERVER_PORT=8501
      - STREAMLIT_SERVER_ADDRESS=0.0.0.0
    extra_hosts:
      # Allow container to reach host
      - "host.docker.internal:host-gateway"
    volumes:
      # Persist data
      - app_data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8501/_stcore/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - ics-network

volumes:
  app_data:
    name: ics_app_data

networks:
  ics-network:
    name: ics_network
    driver: bridge
